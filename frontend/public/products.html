<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>First Wood</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-title="nav_products">
  <header id="site-header"></header>

  <main class="container section">
    <h1 data-i18n="prod_title"></h1>
    <p data-i18n="prod_sub"></p>

    <div class="grid">
      <div class="card">
        <div class="ph"></div>
        <h3 data-i18n="blades_title"></h3>
        <p data-i18n="blades_text"></p>
        <a class="btn" href="/contact.html?type=quote" data-i18n="btn_enquire"></a>
      </div>
      <div class="card">
        <div class="ph raw"></div>
        <h3 data-i18n="raw_title"></h3>
        <p data-i18n="raw_text"></p>
        <a class="btn" href="/contact.html?type=raw_wood" data-i18n="btn_enquire"></a>
      </div>
      <div class="card">
        <div class="ph deal"></div>
        <h3 data-i18n="custom_title"></h3>
        <p data-i18n="custom_text"></p>
        <a class="btn" href="/contact.html?type=deal" data-i18n="btn_enquire"></a>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
