<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>First Wood</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-title="nav_contact">
  <header id="site-header"></header>

  <main class="container section">
    <h1 data-i18n="contact_title"></h1>
    <p data-i18n="contact_sub"></p>

    <form id="enquiry-form" class="card">
      <label data-i18n="f_name"></label>
      <input name="name" maxlength="200" required />

      <label data-i18n="f_company"></label>
      <input name="company" maxlength="200" />

      <label data-i18n="f_email"></label>
      <input name="email" type="email" dir="ltr" />

      <label data-i18n="f_phone"></label>
      <input name="phone" type="tel" dir="ltr" />

      <label data-i18n="f_type"></label>
      <select name="type" required>
        <option value="quote" data-i18n="t_quote"></option>
        <option value="raw_wood" data-i18n="t_raw_wood"></option>
        <option value="deal" data-i18n="t_deal"></option>
        <option value="consultation" data-i18n="t_consultation"></option>
        <option value="other" data-i18n="t_other"></option>
      </select>

      <label data-i18n="f_message"></label>
      <textarea name="message" rows="5" maxlength="5000" required></textarea>

      <p id="form-msg" class="msg"></p>
      <button class="btn" type="submit" data-i18n="f_submit"></button>
    </form>
  </main>

  <footer id="site-footer"></footer>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
